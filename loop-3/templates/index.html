<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps Agent</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: #e6e6e6;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* =========================
           SIDEBAR
        ========================== */

        .sidebar {
            width: 230px;
            background: #171a21;
            border-right: 1px solid #2b2f3a;
            padding: 20px 12px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            padding: 10px 12px 25px;
        }

        .nav-item {
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 6px;
            cursor: pointer;
            color: #b8bcc7;
        }

        .nav-item:hover {
            background: #222631;
            color: white;
        }

        .nav-item.active {
            background: #272c38;
            color: white;
        }

        .incident-badge {
            float: right;
            background: #d64545;
            color: white;
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 11px;
        }

        /* =========================
           MAIN
        ========================== */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header {
            height: 60px;
            border-bottom: 1px solid #2b2f3a;
            display: flex;
            align-items: center;
            padding: 0 25px;
            font-size: 18px;
            font-weight: bold;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        /* =========================
           CHAT
        ========================== */

        #chatPanel {
            max-width: 1000px;
            margin: auto;
        }

        .messages {
            min-height: 70vh;
        }

        .message {
            margin-bottom: 18px;
            padding: 14px;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .user-message {
            background: #20242e;
        }

        .agent-message {
            background: #171c25;
            border: 1px solid #2a303c;
        }

        .chat-input {
            display: flex;
            gap: 10px;
            position: sticky;
            bottom: 0;
            background: #0f1117;
            padding-top: 15px;
        }

        .chat-input input {
            flex: 1;
            padding: 14px;
            background: #171a21;
            border: 1px solid #343946;
            border-radius: 6px;
            color: white;
            outline: none;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .send-btn {
            background: #3b82f6;
            color: white;
        }

        .send-btn:hover {
            background: #2563eb;
        }

        /* =========================
           INCIDENTS
        ========================== */

        #incidentPanel {
            display: none;
            max-width: 1200px;
            margin: auto;
        }

        .incident-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .incident-header h2 {
            margin: 0;
        }

        .refresh-text {
            color: #7f8796;
            font-size: 12px;
        }

        .incident-card {
            background: #171a21;
            border: 1px solid #2b2f3a;
            border-radius: 8px;
            margin-bottom: 18px;
            overflow: hidden;
        }

        .incident-card-header {
            padding: 16px 18px;
            border-bottom: 1px solid #2b2f3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .incident-title {
            font-weight: bold;
            font-size: 16px;
        }

        .incident-id {
            color: #7f8796;
            font-size: 12px;
            margin-top: 5px;
        }

        .severity-critical {
            background: #7f1d1d;
            color: #fecaca;
        }

        .severity-warning {
            background: #78350f;
            color: #fed7aa;
        }

        .severity-info {
            background: #1e3a8a;
            color: #bfdbfe;
        }

        .badge {
            padding: 5px 9px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .incident-body {
            padding: 18px;
        }

        .incident-meta {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        .meta-box {
            background: #11141b;
            padding: 12px;
            border-radius: 6px;
        }

        .meta-label {
            font-size: 11px;
            color: #7f8796;
            margin-bottom: 5px;
        }

        .meta-value {
            font-size: 13px;
        }

        /* =========================
           AGENT STATUS
        ========================== */

        .agent-section {
            margin-top: 15px;
            border: 1px solid #303541;
            border-radius: 7px;
            overflow: hidden;
        }

        .agent-section-title {
            padding: 12px 15px;
            background: #1d212a;
            font-weight: bold;
        }

        .agent-status {
            padding: 12px 15px;
            font-size: 13px;
        }

        .status-queued {
            color: #facc15;
        }

        .status-investigating {
            color: #60a5fa;
        }

        .status-completed {
            color: #4ade80;
        }

        .status-waiting_for_approval {
            color: #fb923c;
        }

        .status-failed {
            color: #f87171;
        }

        .agent-response {
            padding: 15px;
            background: #11141b;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 13px;
            max-height: 500px;
            overflow-y: auto;
        }

        /* =========================
           REMEDIATION
        ========================== */

        .remediation {
            margin-top: 15px;
            padding: 15px;
            background: #241b12;
            border: 1px solid #704214;
            border-radius: 7px;
        }

        .remediation-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #fb923c;
        }

        .remediation-details {
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .approve-btn {
            background: #16a34a;
            color: white;
            margin-right: 8px;
        }

        .approve-btn:hover {
            background: #15803d;
        }

        .reject-btn {
            background: #dc2626;
            color: white;
        }

        .reject-btn:hover {
            background: #b91c1c;
        }

        .verification {
            margin-top: 15px;
            padding: 15px;
            background: #101b14;
            border: 1px solid #245c35;
            border-radius: 7px;
        }

        .verification-title {
            color: #4ade80;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .empty-state {
            padding: 50px;
            text-align: center;
            color: #737b8c;
        }

        .error {
            color: #f87171;
            padding: 15px;
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 180px;
            }

            .incident-meta {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <div class="sidebar">

        <div class="logo">
            DevOps Agent
        </div>

        <div
            id="chatNav"
            class="nav-item active"
            onclick="showChat()"
        >
            Chat
        </div>

        <div
            id="incidentNav"
            class="nav-item"
            onclick="showIncidents()"
        >
            Incidents

            <span
                id="incidentBadge"
                class="incident-badge"
                style="display:none;"
            >
                0
            </span>

        </div>

    </div>


    <!-- =========================
         MAIN
    ========================== -->

    <div class="main">

        <div class="header" id="pageTitle">
            DevOps Agent
        </div>

        <div class="content">


            <!-- =========================
                 CHAT PANEL
            ========================== -->

            <div id="chatPanel">

                <div
                    id="messages"
                    class="messages"
                ></div>

                <div class="chat-input">

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Ask the DevOps Agent..."
                        onkeydown="handleEnter(event)"
                    >

                    <button
                        class="send-btn"
                        onclick="sendMessage()"
                    >
                        Send
                    </button>

                </div>

            </div>


            <!-- =========================
                 INCIDENT PANEL
            ========================== -->

            <div id="incidentPanel">

                <div class="incident-header">

                    <div>
                        <h2>Incidents</h2>

                        <div class="refresh-text">
                            Automatically detected by Alertmanager
                        </div>
                    </div>

                    <div class="refresh-text">
                        Auto refresh: 5 seconds
                    </div>

                </div>

                <div id="incidentList">

                    <div class="empty-state">
                        No incidents detected.
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    /* =====================================================
       GLOBAL STATE
    ===================================================== */

    let currentIncidents = [];


    /* =====================================================
       NAVIGATION
    ===================================================== */

    function showChat() {

        document.getElementById("chatPanel").style.display = "block";
        document.getElementById("incidentPanel").style.display = "none";

        document.getElementById("chatNav").classList.add("active");
        document.getElementById("incidentNav").classList.remove("active");

        document.getElementById("pageTitle").innerText =
            "DevOps Agent";
    }


    function showIncidents() {

        document.getElementById("chatPanel").style.display = "none";
        document.getElementById("incidentPanel").style.display = "block";

        document.getElementById("chatNav").classList.remove("active");
        document.getElementById("incidentNav").classList.add("active");

        document.getElementById("pageTitle").innerText =
            "Incidents";

        loadIncidents();
    }


    /* =====================================================
       CHAT
    ===================================================== */

    function handleEnter(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    }


    async function sendMessage() {

        const input =
            document.getElementById("messageInput");

        const message =
            input.value.trim();

        if (!message) {
            return;
        }

        addMessage("user-message", message);

        input.value = "";

        addMessage(
            "agent-message",
            "DevOps Agent is thinking..."
        );

        try {

            const response = await fetch(
                "/chat",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                }
            );

            const data = await response.json();

            const messages =
                document.getElementById("messages");

            messages.removeChild(
                messages.lastElementChild
            );

            if (data.error) {

                addMessage(
                    "agent-message",
                    "Error: " + data.error
                );

                return;
            }

            addMessage(
                "agent-message",
                data.response || "No response received."
            );

            if (data.pending_action) {

                addApprovalMessage(
                    data.action_id,
                    data.pending_action
                );

            }

        } catch (error) {

            addMessage(
                "agent-message",
                "Request failed: " + error
            );

        }

    }


    function addMessage(className, text) {

        const messages =
            document.getElementById("messages");

        const div =
            document.createElement("div");

        div.className =
            "message " + className;

        div.innerText = text;

        messages.appendChild(div);

        messages.scrollTop =
            messages.scrollHeight;
    }


    function addApprovalMessage(actionId, action) {

        const messages =
            document.getElementById("messages");

        const div =
            document.createElement("div");

        div.className =
            "message agent-message";

        div.innerHTML = `
            <strong>Remediation requires approval</strong>

            <br><br>

            Tool:
            ${escapeHtml(action.tool)}

            <br>

            Arguments:
            ${escapeHtml(JSON.stringify(action.arguments))}

            <br><br>

            <button
                class="approve-btn"
                onclick="approveAction('${escapeHtml(actionId)}')"
            >
                Approve & Execute
            </button>

            <button
                class="reject-btn"
                onclick="rejectAction('${escapeHtml(actionId)}')"
            >
                Reject
            </button>
        `;

        messages.appendChild(div);
    }


    async function approveAction(actionId) {

        try {

            const response = await fetch(
                "/approve",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        action_id: actionId
                    })
                }
            );

            const data = await response.json();

            addMessage(
                "agent-message",
                JSON.stringify(data, null, 2)
            );

            loadIncidents();

        } catch (error) {

            addMessage(
                "agent-message",
                "Approval failed: " + error
            );

        }

    }


    async function rejectAction(actionId) {

        try {

            const response = await fetch(
                "/reject",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        action_id: actionId
                    })
                }
            );

            const data = await response.json();

            addMessage(
                "agent-message",
                data.message || "Remediation rejected."
            );

            loadIncidents();

        } catch (error) {

            addMessage(
                "agent-message",
                "Reject failed: " + error
            );

        }

    }


    /* =====================================================
       INCIDENT LOADING
    ===================================================== */

    async function loadIncidents() {

        try {

            const response =
                await fetch("/incidents");

            const data =
                await response.json();

            if (!data.success) {
                return;
            }

            currentIncidents =
                data.incidents || [];

            updateIncidentBadge(
                currentIncidents
            );

            renderIncidents(
                currentIncidents
            );

        } catch (error) {

            console.error(
                "Failed to load incidents:",
                error
            );

        }

    }


    /* =====================================================
       INCIDENT BADGE
    ===================================================== */

    function updateIncidentBadge(incidents) {

        const badge =
            document.getElementById("incidentBadge");

        const activeCount =
            incidents.filter(
                incident =>
                    incident.status === "firing"
            ).length;

        if (activeCount > 0) {

            badge.style.display = "inline-block";

            badge.innerText =
                activeCount;

        } else {

            badge.style.display = "none";

        }

    }


    /* =====================================================
       INCIDENT RENDERING
    ===================================================== */

    function renderIncidents(incidents) {

        const container =
            document.getElementById("incidentList");

        if (!incidents.length) {

            container.innerHTML = `
                <div class="empty-state">
                    No incidents detected.
                </div>
            `;

            return;
        }


        /*
         * Newest incidents first
         */

        incidents =
            [...incidents].reverse();


        container.innerHTML =
            incidents.map(
                incident => renderIncident(incident)
            ).join("");

    }


    function renderIncident(incident) {

        const severity =
            incident.severity || "unknown";

        const severityClass =
            severity === "critical"
                ? "severity-critical"
                : severity === "warning"
                    ? "severity-warning"
                    : "severity-info";


        const agentStatus =
            incident.agent_status || "unknown";

        const statusClass =
            "status-" +
            agentStatus;


        let remediationHTML = "";

        if (
            incident.agent_status ===
                "waiting_for_approval"
            &&
            incident.pending_action
            &&
            incident.action_id
        ) {

            const action =
                incident.pending_action;

            remediationHTML = `

                <div class="remediation">

                    <div class="remediation-title">
                        Remediation Requires Approval
                    </div>

                    <div class="remediation-details">

                        <strong>Tool:</strong>
                        ${escapeHtml(action.tool)}

                        <br>

                        <strong>Arguments:</strong>
                        ${escapeHtml(
                            JSON.stringify(
                                action.arguments
                            )
                        )}

                        <br><br>

                        The agent has proposed this
                        action, but it has NOT been
                        executed.

                    </div>

                    <button
                        class="approve-btn"
                        onclick="approveIncidentAction(
                            '${escapeHtml(incident.action_id)}',
                            '${escapeHtml(incident.id)}'
                        )"
                    >
                        Approve & Execute
                    </button>

                    <button
                        class="reject-btn"
                        onclick="rejectIncidentAction(
                            '${escapeHtml(incident.action_id)}',
                            '${escapeHtml(incident.id)}'
                        )"
                    >
                        Reject
                    </button>

                </div>
            `;
        }


        return `

            <div class="incident-card">

                <!-- INCIDENT HEADER -->

                <div class="incident-card-header">

                    <div>

                        <div class="incident-title">

                            ${escapeHtml(
                                incident.summary ||
                                incident.alertname
                            )}

                        </div>

                        <div class="incident-id">

                            ${escapeHtml(
                                incident.id
                            )}

                        </div>

                    </div>

                    <div>

                        <span
                            class="badge ${severityClass}"
                        >
                            ${escapeHtml(
                                severity.toUpperCase()
                            )}
                        </span>

                    </div>

                </div>


                <!-- INCIDENT BODY -->

                <div class="incident-body">


                    <!-- METADATA -->

                    <div class="incident-meta">

                        <div class="meta-box">

                            <div class="meta-label">
                                ALERT
                            </div>

                            <div class="meta-value">
                                ${escapeHtml(
                                    incident.alertname
                                )}
                            </div>

                        </div>


                        <div class="meta-box">

                            <div class="meta-label">
                                INSTANCE
                            </div>

                            <div class="meta-value">
                                ${escapeHtml(
                                    incident.instance
                                )}
                            </div>

                        </div>


                        <div class="meta-box">

                            <div class="meta-label">
                                STATUS
                            </div>

                            <div class="meta-value">
                                ${escapeHtml(
                                    incident.status
                                )}
                            </div>

                        </div>

                    </div>


                    <!-- DESCRIPTION -->

                    <div>

                        <div class="meta-label">
                            ALERT DESCRIPTION
                        </div>

                        <div class="meta-value">
                            ${escapeHtml(
                                incident.description ||
                                "No description available."
                            )}
                        </div>

                    </div>


                    <!-- AGENT -->

                    <div class="agent-section">

                        <div class="agent-section-title">

                            GPT-OSS 120B
                            Investigation

                        </div>


                        <div
                            class="agent-status ${statusClass}"
                        >

                            Agent Status:
                            <strong>
                                ${escapeHtml(
                                    agentStatus
                                )}
                            </strong>

                            <br>

                            ${
                                escapeHtml(
                                    incident.agent_message ||
                                    ""
                                )
                            }

                        </div>


                        ${
                            incident.agent_response
                            ?
                            `
                            <div class="agent-response">

                                ${escapeHtml(
                                    incident.agent_response
                                )}

                            </div>
                            `
                            :
                            ""
                        }

                    </div>


                    <!-- REMEDIATION -->

                    ${remediationHTML}


                    ${
                        incident.agent_error
                        ?
                        `
                        <div class="error">

                            Agent Error:
                            ${escapeHtml(
                                incident.agent_error
                            )}

                        </div>
                        `
                        :
                        ""
                    }

                </div>

            </div>

        `;

    }


    /* =====================================================
       INCIDENT APPROVAL
    ===================================================== */

    async function approveIncidentAction(
        actionId,
        incidentId
    ) {

        if (
            !confirm(
                "Are you sure you want to execute this remediation?"
            )
        ) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/approve",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            action_id: actionId
                        })
                    }
                );


            const data =
                await response.json();


            /*
             * Refresh incident information
             */

            await loadIncidents();


            /*
             * Show verification in incident
             */

            if (data.success) {

                alert(
                    "Remediation executed successfully."
                );

            } else {

                alert(
                    "Remediation failed: " +
                    (data.error || "Unknown error")
                );

            }

        } catch (error) {

            alert(
                "Approval request failed: " +
                error
            );

        }

    }


    async function rejectIncidentAction(
        actionId,
        incidentId
    ) {

        try {

            const response =
                await fetch(
                    "/reject",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            action_id: actionId
                        })
                    }
                );


            const data =
                await response.json();


            await loadIncidents();


            alert(
                data.message ||
                "Remediation rejected."
            );


        } catch (error) {

            alert(
                "Reject failed: " +
                error
            );

        }

    }


    /* =====================================================
       SECURITY
    ===================================================== */

    function escapeHtml(value) {

        if (value === null ||
            value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =====================================================
       AUTO REFRESH
    ===================================================== */

    /*
     * This is important.
     *
     * Alertmanager creates the incident.
     *
     * Flask starts GPT-OSS investigation
     * in the background.
     *
     * The browser polls every 5 seconds.
     *
     * Therefore the UI changes automatically:
     *
     * queued
     *    ↓
     * investigating
     *    ↓
     * completed
     *
     * OR
     *
     * waiting_for_approval
     */

    setInterval(
        loadIncidents,
        5000
    );


    /*
     * Load incidents immediately
     * when the page opens.
     */

    loadIncidents();

</script>

</body>
</html>
