<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps Agent</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f1117;
            color: #e6e6e6;
            font-family: Arial, sans-serif;
        }

        /* HEADER */

        .header {
            height: 65px;
            background: #171a21;
            border-bottom: 1px solid #2a2f3a;

            display: flex;
            align-items: center;

            padding: 0 25px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        .status {
            margin-left: 20px;
            font-size: 13px;
            color: #8f98a8;
        }

        /* MAIN */

        .container {
            max-width: 1000px;
            margin: auto;

            height: calc(100vh - 65px);

            display: flex;
            flex-direction: column;
        }

        /* CHAT */

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .message {
            margin-bottom: 20px;

            padding: 16px 18px;

            border-radius: 10px;

            line-height: 1.6;

            white-space: pre-wrap;
        }

        .user {
            background: #1d2633;
            margin-left: 20%;
        }

        .assistant {
            background: #171a21;

            border: 1px solid #292f3a;

            margin-right: 10%;
        }

        .loading {
            color: #8f98a8;
            font-style: italic;
        }

        /* APPROVAL */

        .approval {
            margin: 20px 10% 25px 0;

            padding: 22px;

            border: 1px solid #8b5cf6;

            background: #191622;

            border-radius: 12px;
        }

        .approval-title {
            font-size: 19px;
            font-weight: bold;

            margin-bottom: 18px;
        }

        .approval-warning {
            background: #241f2e;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 18px;

            color: #d5c9ff;
        }

        .approval-info {
            line-height: 1.8;

            margin-bottom: 20px;
        }

        .label {
            color: #8f98a8;
        }

        .value {
            font-weight: bold;
        }

        /* BUTTONS */

        button {
            border: none;

            padding: 12px 20px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .approve {
            background: #22c55e;
            color: #07130b;

            margin-right: 10px;
        }

        .reject {
            background: #ef4444;
            color: white;
        }

        /* INPUT */

        .input-area {
            padding: 20px;

            border-top: 1px solid #2a2f3a;

            display: flex;

            gap: 10px;
        }

        textarea {
            flex: 1;

            resize: none;

            height: 55px;

            background: #171a21;

            color: white;

            border: 1px solid #303644;

            border-radius: 8px;

            padding: 15px;

            font-size: 15px;

            outline: none;
        }

        textarea:focus {
            border-color: #4f46e5;
        }

        .send {
            background: #4f46e5;

            color: white;

            width: 90px;
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <div class="title">
            DevOps Agent
        </div>

        <div class="status">
            GPT-OSS 120B
        </div>

    </div>


    <!-- MAIN -->

    <div class="container">


        <div id="chat"></div>


        <!-- INPUT -->

        <div class="input-area">

            <textarea
                id="message"
                placeholder="Ask the DevOps Agent to investigate..."
            ></textarea>

            <button
                class="send"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>


    </div>


<script>


// =========================================================
// ELEMENTS
// =========================================================

const chat =
    document.getElementById("chat");

const messageInput =
    document.getElementById("message");


// =========================================================
// ADD MESSAGE
// =========================================================

function addMessage(text, type) {

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.innerText =
        text;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;

    return div;
}


// =========================================================
// SEND MESSAGE
// =========================================================

async function sendMessage() {

    const message =
        messageInput.value.trim();

    if (!message) {
        return;
    }


    // USER MESSAGE

    addMessage(
        message,
        "user"
    );


    messageInput.value = "";


    // LOADING

    const loading =
        addMessage(
            "Investigating...",
            "assistant loading"
        );


    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })
                }
            );


        const data =
            await response.json();


        loading.remove();


        // ERROR

        if (data.error) {

            addMessage(
                "Error: " + data.error,
                "assistant"
            );

            return;
        }


        // AGENT RESPONSE

        addMessage(
            data.response,
            "assistant"
        );


        // APPROVAL REQUEST

        if (data.pending_action) {

            showApproval(
                data.action_id,
                data.pending_action
            );

        }

    }

    catch (error) {

        loading.remove();

        addMessage(
            "Request failed: " + error,
            "assistant"
        );

    }

}


// =========================================================
// SHOW APPROVAL
// =========================================================

function showApproval(
    actionId,
    action
) {

    const box =
        document.createElement("div");

    box.className =
        "approval";


    const pid =
        action.arguments.pid;


    box.innerHTML = `

        <div class="approval-title">
            Remediation Required
        </div>


        <div class="approval-warning">

            The DevOps Agent has identified
            a remediation action.

            Human approval is required
            before making the change.

        </div>


        <div class="approval-info">

            <div>

                <span class="label">
                    Action:
                </span>

                <span class="value">
                    Terminate Process
                </span>

            </div>


            <div>

                <span class="label">
                    Process:
                </span>

                <span class="value">
                    ${action.description}
                </span>

            </div>


            <div>

                <span class="label">
                    PID:
                </span>

                <span class="value">
                    ${pid}
                </span>

            </div>

        </div>


        <button
            class="approve"
            onclick="approveAction('${actionId}', this)"
        >
            Approve & Execute
        </button>


        <button
            class="reject"
            onclick="rejectAction('${actionId}', this)"
        >
            Reject
        </button>

    `;


    chat.appendChild(box);

    chat.scrollTop =
        chat.scrollHeight;
}


// =========================================================
// APPROVE
// =========================================================

async function approveAction(
    actionId,
    button
) {

    button.disabled =
        true;

    button.innerText =
        "Executing...";


    try {

        const response =
            await fetch(
                "/approve",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        action_id: actionId
                    })
                }
            );


        const data =
            await response.json();


        // SUCCESS

        if (data.success) {

            addMessage(

                "REMEDIATION EXECUTED\n\n" +

                JSON.stringify(
                    data.result,
                    null,
                    2
                ),

                "assistant"
            );


            // VERIFICATION

            addMessage(

                "VERIFICATION\n\n" +

                JSON.stringify(
                    data.verification.server,
                    null,
                    2
                ),

                "assistant"
            );


            // TOP PROCESSES

            const processes =
                data.verification.processes;


            const topProcesses =
                processes.processes.slice(0, 5);


            addMessage(

                "Top processes after remediation:\n\n" +

                JSON.stringify(
                    topProcesses,
                    null,
                    2
                ),

                "assistant"
            );

        }

        else {

            addMessage(

                "REMEDIATION FAILED\n\n" +

                JSON.stringify(
                    data,
                    null,
                    2
                ),

                "assistant"
            );

        }


        // REMOVE APPROVAL BOX

        button.parentElement.remove();

    }

    catch (error) {

        button.disabled =
            false;

        button.innerText =
            "Approve & Execute";


        addMessage(

            "Approval failed: " +
            error,

            "assistant"
        );

    }

}


// =========================================================
// REJECT
// =========================================================

async function rejectAction(
    actionId,
    button
) {

    button.disabled =
        true;


    try {

        await fetch(
            "/reject",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    action_id: actionId
                })
            }
        );


        button.parentElement.remove();


        addMessage(

            "REMEDIATION REJECTED\n\n" +
            "No changes were made to the server.",

            "assistant"
        );

    }

    catch (error) {

        addMessage(

            "Reject failed: " +
            error,

            "assistant"
        );

    }

}


// =========================================================
// ENTER KEY
// =========================================================

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


</script>


</body>

</html>
