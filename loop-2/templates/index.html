<!DOCTYPE html>
<html>

<head>

    <title>VASS DevOps Agent</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            background: #0f1117;

            color: #e6e6e6;

            font-family:
                Arial,
                sans-serif;

        }

        .header {

            height: 65px;

            background: #171a21;

            border-bottom:
                1px solid #2a2f3a;

            display: flex;

            align-items: center;

            padding: 0 25px;

        }

        .title {

            font-size: 20px;

            font-weight: bold;

        }

        .status {

            margin-left: 20px;

            font-size: 13px;

            color: #8f98a8;

        }

        .container {

            max-width: 1000px;

            margin: auto;

            height:
                calc(100vh - 65px);

            display: flex;

            flex-direction: column;

        }

        #chat {

            flex: 1;

            overflow-y: auto;

            padding: 30px;

        }

        .message {

            margin-bottom: 20px;

            padding: 15px 18px;

            border-radius: 10px;

            line-height: 1.6;

            white-space: pre-wrap;

        }

        .user {

            background: #1d2633;

            margin-left: 20%;

        }

        .assistant {

            background: #171a21;

            border:
                1px solid #292f3a;

            margin-right: 10%;

        }

        .approval {

            margin: 20px 0;

            padding: 20px;

            border:
                1px solid #8b5cf6;

            background: #191622;

            border-radius: 10px;

        }

        .approval-title {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 12px;

        }

        .approval-info {

            margin-bottom: 15px;

            color: #b9c0cc;

        }

        button {

            border: none;

            padding: 11px 18px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;

        }

        .approve {

            background: #22c55e;

            color: #07130b;

            margin-right: 10px;

        }

        .reject {

            background: #ef4444;

            color: white;

        }

        .input-area {

            padding: 20px;

            border-top:
                1px solid #2a2f3a;

            display: flex;

            gap: 10px;

        }

        textarea {

            flex: 1;

            resize: none;

            height: 55px;

            background: #171a21;

            color: white;

            border:
                1px solid #303644;

            border-radius: 8px;

            padding: 15px;

            font-size: 15px;

        }

        .send {

            background: #4f46e5;

            color: white;

            width: 90px;

        }

        .loading {

            color: #8f98a8;

            font-style: italic;

        }

    </style>

</head>


<body>


<div class="header">

    <div class="title">
        VASS DevOps Agent
    </div>

    <div class="status">
        GPT-OSS 120B
    </div>

</div>


<div class="container">


    <div id="chat"></div>


    <div class="input-area">

        <textarea
            id="message"
            placeholder="Ask the DevOps Agent to investigate..."
        ></textarea>

        <button
            class="send"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>


</div>


<script>


const chat =
    document.getElementById("chat");


const messageInput =
    document.getElementById("message");


// ---------------------------------------------------------
// ADD MESSAGE
// ---------------------------------------------------------

function addMessage(
    text,
    type
) {

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.innerText =
        text;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;

    return div;
}


// ---------------------------------------------------------
// SEND MESSAGE
// ---------------------------------------------------------

async function sendMessage() {


    const message =
        messageInput.value.trim();


    if (!message) {

        return;

    }


    addMessage(
        message,
        "user"
    );


    messageInput.value = "";


    const loading =
        addMessage(
            "Investigating...",
            "assistant loading"
        );


    try {


        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                }
            );


        const data =
            await response.json();


        loading.remove();


        if (data.error) {

            addMessage(
                "Error: " +
                data.error,
                "assistant"
            );

            return;
        }


        addMessage(
            data.response,
            "assistant"
        );


        // -------------------------------------------------
        // SHOW APPROVAL
        // -------------------------------------------------

        if (data.pending_action) {

            showApproval(
                data.action_id,
                data.pending_action
            );

        }


    }

    catch (error) {

        loading.remove();

        addMessage(
            "Request failed: " +
            error,
            "assistant"
        );

    }

}


// ---------------------------------------------------------
// SHOW APPROVAL BOX
// ---------------------------------------------------------

function showApproval(
    actionId,
    action
) {


    const box =
        document.createElement("div");

    box.className =
        "approval";


    box.innerHTML = `

        <div class="approval-title">
            Remediation Required
        </div>

        <div class="approval-info">

            The DevOps Agent has identified
            a remediation action.

            <br><br>

            <strong>Action:</strong>
            ${action.description}

            <br>

            <strong>PID:</strong>
            ${action.arguments.pid}

        </div>

        <button
            class="approve"
            onclick="approveAction('${actionId}', this)"
        >
            Approve & Execute
        </button>

        <button
            class="reject"
            onclick="rejectAction('${actionId}', this)"
        >
            Reject
        </button>

    `;


    chat.appendChild(box);

    chat.scrollTop =
        chat.scrollHeight;

}


// ---------------------------------------------------------
// APPROVE
// ---------------------------------------------------------

async function approveAction(
    actionId,
    button
) {


    button.disabled = true;

    button.innerText =
        "Executing...";


    try {


        const response =
            await fetch(
                "/approve",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        action_id:
                            actionId

                    })

                }
            );


        const data =
            await response.json();


        if (data.success) {

            addMessage(

                "Remediation executed successfully.\n\n"
                +
                JSON.stringify(
                    data.result,
                    null,
                    2
                ),

                "assistant"

            );

        }

        else {

            addMessage(

                "Remediation failed.\n\n"
                +
                JSON.stringify(
                    data.result || data,
                    null,
                    2
                ),

                "assistant"

            );

        }


        button.parentElement.remove();


    }

    catch (error) {

        button.disabled = false;

        button.innerText =
            "Approve & Execute";

        addMessage(

            "Approval failed: " +
            error,

            "assistant"

        );

    }

}


// ---------------------------------------------------------
// REJECT
// ---------------------------------------------------------

async function rejectAction(
    actionId,
    button
) {


    button.disabled = true;


    try {


        await fetch(
            "/reject",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    action_id:
                        actionId

                })

            }
        );


        button.parentElement.remove();


        addMessage(

            "Remediation rejected. No changes were made.",

            "assistant"

        );


    }

    catch (error) {

        addMessage(

            "Reject failed: " +
            error,

            "assistant"

        );

    }

}


// ---------------------------------------------------------
// ENTER KEY
// ---------------------------------------------------------

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


</script>


</body>

</html>
