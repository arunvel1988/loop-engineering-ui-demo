global:

  resolve_timeout: 5m


route:

  group_by:
    - alertname
    - instance

  group_wait: 10s

  group_interval: 30s

  repeat_interval: 4h

  receiver: devops-agent


receivers:

  - name: devops-agent

    webhook_configs:

      - url: "http://host.docker.internal:5000/webhook/alert"

        send_resolved: true
